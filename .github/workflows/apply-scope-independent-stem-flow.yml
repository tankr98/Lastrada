name: Apply scope-independent stem flow

on:
  push:
    branches:
      - feat/stem-assisted-main-flow
    paths:
      - .github/workflows/apply-scope-independent-stem-flow.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stem-assisted-main-flow
          fetch-depth: 0

      - name: Apply the product-flow patch
        run: python scripts/patch_scope_independent_stems.py

      - name: Validate the changed flow
        run: |
          python -m compileall -q app.py src tests
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_stem_main_flow.py

      - name: Commit the product-flow changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py src/lastrada/pipeline.py tests/test_stem_main_flow.py
          if git diff --cached --quiet; then
            echo "Scope-independent stem flow is already applied."
            exit 0
          fi
          git commit -m "Generate stem evidence across rights scopes"
          git pull --rebase origin feat/stem-assisted-main-flow
          git push origin HEAD:feat/stem-assisted-main-flow
