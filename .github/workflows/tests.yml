name: Synthetic validation
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
      - run: ruff check .
      - run: pytest -q
      - run: python scripts/synthetic_smoke.py
