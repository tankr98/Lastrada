name: Cancel redundant fallback release

on:
  push:
    branches: [local/stem-fast]
    paths:
      - .github/workflows/cancel-redundant-release.yml

permissions:
  contents: read
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel the redundant fallback deployment
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: 43363650409
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/cancel"
