name: Apply stem evidence table patch

on:
  push:
    branches: [feat/stem-assisted-main-flow]
    paths:
      - scripts/apply_stem_evidence_table_patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stem-assisted-main-flow
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply product UI and evidence-model patch
        run: python scripts/apply_stem_evidence_table_patch.py
      - name: Install test dependencies
        run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
      - name: Validate
        run: |
          ruff check .
          pytest -q
          python scripts/synthetic_smoke.py
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py src/lastrada/pipeline.py src/lastrada/schemas/models.py tests/test_stem_main_flow.py
          git diff --cached --quiet && exit 0
          git commit -m "Show structured stem verdicts in the main review flow"
          git push origin HEAD:feat/stem-assisted-main-flow
