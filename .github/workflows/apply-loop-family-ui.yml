name: Apply loop-family review UI

on:
  push:
    branches:
      - local/stem-fast
    paths:
      - .github/workflows/apply-loop-family-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: local/stem-fast
          fetch-depth: 0

      - name: Patch the main review UI
        run: python scripts/apply_loop_family_ui.py

      - name: Validate
        run: |
          python -m compileall -q app.py src tests
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_loop_groups.py tests/test_suggestions.py
          python -m pytest -q
          python scripts/synthetic_smoke.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-loop-family-ui.yml
          git rm scripts/apply_loop_family_ui.py
          git add app.py src/lastrada/reporting/loop_groups.py tests/test_loop_groups.py
          git commit -m "Group repeated sample timings into loop families"
          git pull --rebase origin local/stem-fast
          git push origin HEAD:local/stem-fast
