name: Patch exhaustive stem UI copy

on:
  push:
    branches:
      - feat/stem-assisted-main-flow
    paths:
      - .github/workflows/patch-exhaustive-stem-copy.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stem-assisted-main-flow
          fetch-depth: 0

      - name: Update reviewer copy and method summary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          app_path = Path("app.py")
          app = app_path.read_text(encoding="utf-8")
          app = replace_once(
              app,
              "Separates the strongest Sony candidate into estimated stems and ",
              "Separates every Sony candidate returned by the current run into estimated stems and ",
              "Demucs checkbox help",
          )
          app = replace_once(
              app,
              "Demucs estimates instrument stems for the strongest Sony candidate region, ",
              "Demucs estimates instrument stems for every Sony candidate region returned by the current run, ",
              "stem evidence caption",
          )
          app_path.write_text(app, encoding="utf-8")

          pipeline_path = Path("src/lastrada/pipeline.py")
          pipeline = pipeline_path.read_text(encoding="utf-8")
          pipeline = replace_once(
              pipeline,
              '''        result.methods["stems"] = (
            f"demucs_{settings.stem_model_name}_candidate_regions; "
            f"accepted_pairs={pair_summary}; "
            f"timings_refined={refined_candidates}"
        )
''',
              '''        result.methods["stems"] = (
            f"demucs_{settings.stem_model_name}_candidate_regions; "
            f"candidates_evaluated={len(comparisons)}; "
            f"duration_ratio_range={settings.dtw_min_duration_ratio:g}x-"
            f"{settings.dtw_max_duration_ratio:g}x; "
            f"accepted_pairs={pair_summary}; "
            f"timings_refined={refined_candidates}"
        )
''',
              "stem method summary",
          )
          pipeline_path.write_text(pipeline, encoding="utf-8")
          PY

      - name: Validate
        shell: bash
        run: |
          python -m compileall -q app.py src
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_stem_main_flow.py

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py src/lastrada/pipeline.py
          git commit -m "Describe exhaustive stem analysis in the main UI"
          git pull --rebase origin feat/stem-assisted-main-flow
          git push origin HEAD:feat/stem-assisted-main-flow
