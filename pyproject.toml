[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lastrada"
version = "0.1.0"
description = "Local, rights-aware audio-to-documentation review assistant"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26,<3", "scipy>=1.12,<2", "scikit-learn>=1.4,<2",
  "soundfile>=0.12,<1", "pandas>=2.2,<3", "openpyxl>=3.1,<4",
  "pydantic>=2.8,<3", "streamlit>=1.65,<2", "plotly>=5.24,<7",
  "threadpoolctl>=3.5,<4"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
sampleid = ["torch>=2.6,<3", "hydra-core>=1.3,<2", "tqdm>=4.66,<5"]
stems = ["demucs>=4.0,<5"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
